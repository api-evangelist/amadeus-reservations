  - type: Features
    data:
      - name: Hotel Booking at Scale
        description: >-
          Book rooms at over 150,000 hotels worldwide using Amadeus GDS connectivity, with instant confirmation and
          property reference numbers.
      - name: Flight Order Creation
        description: >-
          Create confirmed airline reservations with full PNR support across hundreds of airlines in the Amadeus
          inventory.
      - name: Multi-Traveler Bookings
        description: >-
          Create reservations for multiple travelers in a single API call, managing individual passenger details and
          fare assignments.
      - name: Ground Transfer Bookings
        description: Book airport taxis, private cars, and shuttle services with real-time availability and instant confirmation.
      - name: Order Management
        description: >-
          Retrieve and cancel existing flight and transfer reservations programmatically with full booking detail
          access.
  - type: UseCases
    data:
      - name: Online Travel Agency Booking Engine
        description: Power end-to-end booking flows for flights, hotels, and transfers on consumer-facing OTA platforms.
      - name: Corporate Travel Management
        description: >-
          Enable corporate travel managers to book and manage business travel including flights and hotel accommodations
          with policy compliance.
      - name: Travel App Integration
        description: >-
          Integrate booking capabilities into mobile travel apps providing users with seamless reservation creation from
          search to confirmation.
      - name: Itinerary Builder
        description: >-
          Build complete multi-modal itineraries combining flight bookings with hotel reservations and ground transfers
          through unified API access.
      - name: Travel Chatbot
        description: >-
          Enable AI-powered travel assistants to create and manage bookings on behalf of travelers through
          conversational interfaces.
  - type: Integrations
    data:
      - name: Amadeus Flight Offers Search
        description: >-
          Flight Create Orders works with Flight Offers Search to convert priced flight offers into confirmed airline
          reservations.
      - name: Amadeus Hotel Search
        description: >-
          Hotel Booking completes the hotel shopping flow started by Hotel Search, converting hotel offers into
          confirmed reservations.
      - name: Amadeus Transfer Search
        description: Transfer Booking confirms ground transportation offers returned by the Transfer Search API.
      - name: Amadeus Flight Offers Price
        description: Validate and reprice flight offers before booking to ensure accurate pricing at time of reservation creation.
      - name: Amadeus Hotel Name Autocomplete
        description: >-
          Use Hotel Name Autocomplete to let users search for properties before fetching offers and creating hotel
          bookings.
