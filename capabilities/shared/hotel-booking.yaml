naftiko: "1.0.0-alpha1"

info:
  label: Amadeus Hotel Booking API
  description: Shared capability for creating hotel reservations using Amadeus Hotel Booking API.
  tags:
    - Amadeus
    - Hotels
    - Booking
    - Reservations
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AMADEUS_API_KEY: AMADEUS_API_KEY
      AMADEUS_API_SECRET: AMADEUS_API_SECRET

capability:
  consumes:
    - type: http
      namespace: hotel-booking
      baseUri: https://test.api.amadeus.com/v2
      description: Amadeus Hotel Booking API.
      authentication:
        type: bearer
        token: "{{AMADEUS_BEARER_TOKEN}}"
      resources:
        - name: hotel-orders
          path: /booking/hotel-orders
          description: Create hotel reservations.
          operations:
            - name: create-hotel-order
              method: POST
              description: Create a confirmed hotel booking from a hotel offer.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.bookingData}}"

  exposes:
    - type: rest
      port: 8103
      namespace: hotel-booking-api
      resources:
        - path: /v1/bookings/hotels
          name: hotel-bookings
          description: Hotel booking creation.
          operations:
            - method: POST
              name: create-hotel-order
              description: Create a hotel reservation.
              call: "hotel-booking.create-hotel-order"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9103
      namespace: hotel-booking-mcp
      transport: http
      tools:
        - name: create-hotel-booking
          description: Create a confirmed hotel reservation from a hotel offer ID.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "hotel-booking.create-hotel-order"
          outputParameters:
            - type: object
              mapping: "$."
