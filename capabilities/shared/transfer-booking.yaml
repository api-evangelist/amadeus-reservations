naftiko: "1.0.0-alpha1"

info:
  label: Amadeus Transfer Booking API
  description: Shared capability for creating and managing ground transfer bookings using Amadeus Transfer Booking and Transfer Management APIs.
  tags:
    - Amadeus
    - Transfers
    - Booking
    - Ground Transport
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AMADEUS_API_KEY: AMADEUS_API_KEY
      AMADEUS_API_SECRET: AMADEUS_API_SECRET

capability:
  consumes:
    - type: http
      namespace: transfer-booking
      baseUri: https://test.api.amadeus.com/v1
      description: Amadeus Transfer Booking and Management APIs.
      authentication:
        type: bearer
        token: "{{AMADEUS_BEARER_TOKEN}}"
      resources:
        - name: transfer-orders
          path: /ordering/transfer-orders
          description: Create and manage ground transfer reservations.
          operations:
            - name: create-transfer-order
              method: POST
              description: Create a confirmed ground transfer booking.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.transferData}}"
            - name: cancel-transfer-order
              method: DELETE
              description: Cancel an existing transfer order.
              inputParameters:
                - name: transferOrderId
                  in: query
                  type: string
                  required: true
                  description: Transfer order ID to cancel.
                - name: confirmNbr
                  in: query
                  type: string
                  required: true
                  description: Confirmation number for the transfer.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8105
      namespace: transfer-booking-api
      resources:
        - path: /v1/bookings/transfers
          name: transfer-bookings
          description: Transfer booking management.
          operations:
            - method: POST
              name: create-transfer-order
              description: Create a transfer booking.
              call: "transfer-booking.create-transfer-order"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/bookings/transfers/{transferOrderId}
          name: transfer-order
          description: Individual transfer order management.
          operations:
            - method: DELETE
              name: cancel-transfer-order
              description: Cancel a transfer booking.
              call: "transfer-booking.cancel-transfer-order"
              with:
                transferOrderId: "rest.transferOrderId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9105
      namespace: transfer-booking-mcp
      transport: http
      tools:
        - name: create-transfer-booking
          description: Book a ground transfer (taxi, private car, or shuttle) for airport pickup or drop-off.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "transfer-booking.create-transfer-order"
          outputParameters:
            - type: object
              mapping: "$."
        - name: cancel-transfer-booking
          description: Cancel an existing ground transfer reservation.
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "transfer-booking.cancel-transfer-order"
          with:
            transferOrderId: "tools.transferOrderId"
            confirmNbr: "tools.confirmNbr"
          outputParameters:
            - type: object
              mapping: "$."
