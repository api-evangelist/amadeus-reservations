naftiko: "1.0.0-alpha1"

info:
  label: Amadeus Travel Booking
  description: >-
    Unified workflow capability for complete travel booking encompassing flight
    reservations, hotel bookings, and ground transfer arrangements. Used by
    online travel agencies, travel chatbots, and corporate travel management
    platforms to create end-to-end trip reservations.
  tags:
    - Amadeus
    - Booking
    - Flights
    - Hotels
    - Transfers
    - Travel
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AMADEUS_API_KEY: AMADEUS_API_KEY
      AMADEUS_API_SECRET: AMADEUS_API_SECRET
      AMADEUS_BEARER_TOKEN: AMADEUS_BEARER_TOKEN

capability:
  consumes:
    - import: hotel-booking
      location: ./shared/hotel-booking.yaml
    - import: flight-orders
      location: ./shared/flight-orders.yaml
    - import: transfer-booking
      location: ./shared/transfer-booking.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: travel-booking-api
      description: Unified REST API for multi-modal travel booking.
      resources:
        - path: /v1/bookings/flights
          name: flight-bookings
          description: Flight reservation operations.
          operations:
            - method: POST
              name: create-flight-order
              description: Create a confirmed flight booking.
              call: "flight-orders.create-flight-order"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/bookings/flights/{orderId}
          name: flight-order
          description: Individual flight order management.
          operations:
            - method: GET
              name: get-flight-order
              description: Retrieve a flight booking.
              call: "flight-orders.get-flight-order"
              with:
                orderId: "rest.orderId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: cancel-flight-order
              description: Cancel a flight booking.
              call: "flight-orders.delete-flight-order"
              with:
                orderId: "rest.orderId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/bookings/hotels
          name: hotel-bookings
          description: Hotel reservation operations.
          operations:
            - method: POST
              name: create-hotel-order
              description: Create a confirmed hotel booking.
              call: "hotel-booking.create-hotel-order"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/bookings/transfers
          name: transfer-bookings
          description: Ground transfer reservation operations.
          operations:
            - method: POST
              name: create-transfer-order
              description: Create a confirmed transfer booking.
              call: "transfer-booking.create-transfer-order"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/bookings/transfers/{transferOrderId}
          name: transfer-order
          description: Individual transfer management.
          operations:
            - method: DELETE
              name: cancel-transfer-order
              description: Cancel a transfer booking.
              call: "transfer-booking.cancel-transfer-order"
              with:
                transferOrderId: "rest.transferOrderId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: travel-booking-mcp
      transport: http
      description: MCP server for AI-assisted travel booking across flights, hotels, and transfers.
      tools:
        - name: create-flight-booking
          description: Create a confirmed airline reservation from a priced flight offer.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "flight-orders.create-flight-order"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-flight-booking
          description: Retrieve details of an existing flight reservation by order ID.
          hints:
            readOnly: true
            openWorld: true
          call: "flight-orders.get-flight-order"
          with:
            orderId: "tools.orderId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: cancel-flight-booking
          description: Cancel an existing confirmed flight reservation.
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "flight-orders.delete-flight-order"
          with:
            orderId: "tools.orderId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-hotel-booking
          description: Create a confirmed hotel reservation from a hotel offer at any of 150,000+ hotels worldwide.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "hotel-booking.create-hotel-order"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-transfer-booking
          description: Book a ground transfer (airport taxi, private car, or shuttle) for a traveler.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "transfer-booking.create-transfer-order"
          outputParameters:
            - type: object
              mapping: "$."
        - name: cancel-transfer-booking
          description: Cancel an existing confirmed ground transfer reservation.
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "transfer-booking.cancel-transfer-order"
          with:
            transferOrderId: "tools.transferOrderId"
            confirmNbr: "tools.confirmNbr"
          outputParameters:
            - type: object
              mapping: "$."
